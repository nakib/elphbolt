name = "test_misc"
source-dir="test"
main = "test_misc.f90"

[[test]]
name = "test_autodiff"
source-dir="test"
main = "test_autodiff.f90"

[[test]]
name = "test_periodictable"
source-dir="test"
main = "test_periodictable.f90"

[[test]]
name = "test_vector"
source-dir="test"
main = "test_vector.f90"

[[test]]
